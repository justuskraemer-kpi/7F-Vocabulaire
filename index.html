<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Français · Vokabeltraining</title><style>
:root{font-family:system-ui,-apple-system,Arial,sans-serif;color:#182b43;background:#f3f6fb}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:flex;flex-direction:column}main{flex:1}header{background:#153f75;color:white;padding:20px max(16px,calc((100vw - 900px)/2))}header small{letter-spacing:.08em;opacity:.8}h1{margin:7px 0 0;font-size:clamp(24px,4vw,34px)}main{max-width:900px;margin:24px auto;padding:0 16px 40px}.panel{background:white;border:1px solid #d9e2ee;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 3px 15px #102f5310}.toolbar{display:flex;gap:12px;flex-wrap:wrap;align-items:end}label{font-size:13px;font-weight:700;display:grid;gap:5px}select,button,input{font:inherit}select,input{border:1px solid #bac9da;border-radius:10px;padding:12px;background:white;min-width:0}button{border:0;background:#1756a0;color:white;border-radius:10px;padding:12px 17px;cursor:pointer;font-weight:700;touch-action:manipulation}button.secondary{background:#e7eff8;color:#153f75}button:disabled{opacity:.45;cursor:default}button:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid #f6bf48}button.option{width:100%;text-align:left;background:#f1f6fd;color:#182b43;border:1px solid #d3e1f0;margin:5px 0;font-weight:500}button.option.good{background:#e0f7e8;border-color:#21965c}button.option.bad{background:#ffebeb;border-color:#d94e4e}.modes{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0}.modes button{background:#e7eff8;color:#153f75}.modes button.active{background:#1756a0;color:white}.prompt{text-align:center;background:#eef5ff;border-radius:15px;padding:30px 14px;margin:15px 0}.prompt strong{font-size:clamp(24px,5vw,38px);display:block;overflow-wrap:anywhere}.prompt span{color:#54677f;font-size:14px}.meta{display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;color:#52647b;font-size:14px}.feedback{min-height:25px;margin:12px 0;font-weight:700}.success{color:#167547}.error{color:#b62d32}.answer{display:flex;gap:8px;flex-wrap:wrap}.answer input{flex:1;min-width:170px}.hidden{display:none!important}.hint{font-size:13px;color:#64748b}.progress{height:8px;border-radius:8px;background:#e5edf7;overflow:hidden;margin:10px 0}.progress>div{height:100%;background:#1974c9;transition:width .2s}.end{text-align:center;font-size:20px}.checkbox{display:flex;align-items:center;gap:8px}.checkbox input{width:18px;height:18px}.footer{text-align:center;color:#63748b;font-size:12px;margin-top:22px}@media(max-width:520px){.panel{padding:15px}.toolbar>*{flex:1}select{width:100%}.answer button{width:100%}}.mini-impressum{color:#8993a1;font-size:10px;text-align:center;line-height:1.5;padding:8px 14px 15px;font-weight:400}</style></head><body><header><small>KURPFALZ-INTERNAT · KRÄMER</small><h1>Français · Vokabeltraining</h1></header><main><section class="panel"><div class="toolbar"><label>Vokabelbereich<select id="unit"><option value="all">Unité 1 · Alle Volets</option><option value="1">Volet 1</option><option value="2">Volet 2</option><option value="3">Volet 3</option></select></label><label>Übersetzungsrichtung<select id="direction"><option value="fr">Französisch → Deutsch</option><option value="de">Deutsch → Französisch</option><option value="mix">Gemischt</option></select></label></div><div class="modes" id="modes"><button data-mode="choice" class="active">Multiple Choice</button><button data-mode="type">Eintippen</button><button data-mode="cards">Karteikarten</button><button data-mode="challenge">Challenge</button></div><div class="toolbar"><label class="checkbox"><input type="checkbox" id="missed"> Nur Fehler wiederholen</label><button class="secondary" id="restart">Neu beginnen</button></div><p class="hint" id="count"></p></section><section class="panel hidden" id="status" aria-live="polite"></section><section class="panel" id="game"><div class="meta"><span id="counter"></span><span id="score"></span></div><div class="progress"><div id="bar"></div></div><div class="prompt"><span id="promptlabel"></span><strong id="prompt"></strong></div><div id="choices"></div><div id="typing" class="answer hidden"><input id="typed" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Übersetzung eingeben"><button id="submit">Prüfen</button></div><div id="cardactions" class="answer hidden"><button id="reveal">Antwort aufdecken</button><button id="known" class="secondary hidden">Gewusst ✓</button><button id="unknown" class="secondary hidden">Noch üben ↻</button></div><div class="feedback" id="feedback" aria-live="polite"></div><button id="accept" class="secondary hidden" type="button">Meine Antwort als richtig werten ✓</button> <button id="next" class="hidden">Weiter →</button></section><div class="footer">Üben ohne Anmeldung · Fortschritt nur während dieser Sitzung · Funktioniert offline</div></main><footer class="mini-impressum">Krämer · Kurpfalz-Internat · Diersteinstraße 1–7 · 69245 Bammental</footer><script>
'use strict';
// Vokabeln und Wendungen aus À plus! Neubearbeitung, Unité 1, Volets 1–3, S. 146–151.
// Zusätzliche klar erkennbare Wortschatzeinträge der sechs Buchseiten ergänzt.
// Beispielsätze werden nicht als eigenständige Abfrage verwendet.
const vocab=[
[1,'le matin','der Morgen; der Vormittag; am Vormittag'],[1,'à midi','mittags; um 12 Uhr'],[1,"l’après-midi",'der Nachmittag'],[1,'je ne peux pas','ich kann nicht'],[1,'mais non !','aber nein!; nicht doch!'],[1,'le collège','die Schule; die weiterführende Schule'],[1,'le CDI','die Schulbibliothek'],[1,'la cantine','die Kantine'],[1,'la salle','der Raum; der Unterrichtsraum'],[1,'les toilettes','die Toiletten'],[1,"l’élève",'der Schüler; die Schülerin'],[1,'le surveillant / la surveillante','die Aufsichtsperson'],[1,'le / la CPE','der Schulbetreuer; die Schulbetreuerin'],[1,'le bureau','das Büro'],[1,'la salle des profs','das Lehrerzimmer'],[1,'le principal / la principale','der Schulleiter; die Schulleiterin'],[1,'le prof / la prof','der Lehrer; die Lehrerin'],[1,'le / la documentaliste','der Bibliothekar; die Bibliothekarin'],[1,'le gymnase','die Turnhalle'],[1,'un amphithéâtre','eine Aula; ein Hörsaal'],[1,'un / une concierge','der Hausmeister; die Hausmeisterin'],[1,'des casiers','Schließfächer'],[1,'une cafétéria','eine Cafeteria'],[1,'un délégué / une déléguée','der Klassensprecher; die Klassensprecherin'],[1,'sévère','streng'],[1,'être pressé(e)','es eilig haben'],[1,'partout','überall'],[1,'mon point faible','mein Schwachpunkt'],[1,'oublier','vergessen'],[1,'même','sogar'],[1,'aller','gehen'],[1,'ranger','aufräumen'],[1,'manger','essen'],[1,'préparer','vorbereiten'],[1,'téléphoner','telefonieren'],
[2,'organiser','organisieren'],[2,'surveiller','beaufsichtigen; überwachen'],[2,'la solution','die Lösung'],[2,"l’information",'die Information'],[2,'la récréation','die Pause in der Schule'],[2,'attention !','Achtung!'],[2,'la mission','der Auftrag; die Mission'],[2,'le papier','das Papier; das Dokument'],[2,'le billet de retard','der Nachweis über das Zuspätkommen'],[2,"l’exposé",'der Vortrag'],[2,'la journée','der Tag in seinem Verlauf'],[2,'le cauchemar','der Albtraum'],[2,'commencer','anfangen; beginnen'],[2,'terminer','aufhören; beenden'],[2,'avoir de la chance','Glück haben'],[2,'avoir cours','Unterricht haben'],[2,'le cours','der Unterricht; die Unterrichtsstunde'],[2,'déjà','schon; bereits'],[2,'ensuite','dann; anschließend'],[2,'la matière','das Schulfach'],[2,'la cour','der Schulhof; der Hof'],[2,'est-ce que','Einleitung einer Entscheidungsfrage'],[2,'comment','wie'],[2,'où','wo'],[2,'qui','wer'],[2,'quoi','was'],[2,'quand','wann'],[2,'pourquoi','warum'],[2,'notre / nos','unser / unsere'],[2,'votre / vos','euer / eure; Ihr / Ihre'],[2,'leur / leurs','ihr / ihre'],[2,'râler','meckern; motzen'],[2,'expliquer','erklären'],[2,'raconter sa vie','seine Lebensgeschichte erzählen'],[2,'bizarre','merkwürdig'],
[3,'trop','zu; allzu; zu viel'],[3,'le correspondant / la correspondante','der Austauschpartner; die Austauschpartnerin'],[3,'ça dépend','es kommt darauf an'],[3,'ça suffit !','es reicht!'],[3,'le terrain','der Platz; das Gelände'],[3,'la carte','die Karte'],[3,'allemand / allemande','deutsch'],[3,'donner son avis','seine Meinung äußern'],[3,'le commentaire','der Kommentar'],[3,'je trouve que','ich finde, dass'],[3,'nul / nulle','schlecht; doof'],[3,'bon / bonne','gut'],[3,"l’ambiance",'die Stimmung; die Atmosphäre'],[3,'propre','sauber'],[3,'le bruit','der Lärm; das Geräusch'],[3,"c’est l’horreur !",'das ist schrecklich!'],[3,"c’est nul !",'das ist doof!'],[3,"c’est dommage !",'das ist schade!'],[3,"c’est drôle !",'das ist lustig!'],[3,"c’est super !",'das ist super!'],[3,'il n’y a pas de','es gibt keinen; keine; kein'],[3,'ne … plus de','kein; keine; keinen mehr'],[3,'ne … pas assez de','nicht genug'],[3,'assez de','genug'],[3,'beaucoup de','viel; viele'],[3,'trop de','zu viel; zu viele'],[3,'au secours !','zu Hilfe!'],[3,'donner','geben'],[3,'vite','schnell'],[3,'la rentrée','der Schuljahresbeginn'],[3,"l’an",'das Jahr'],[3,"l’ascenseur",'der Aufzug'],[3,'le plat','das Gericht; das Hauptgericht'],[3,'gaspiller','verschwenden'],[3,'le pain','das Brot'],
[1,"le point faible","der Schwachpunkt"],
[1,"un casier","ein Schließfach"],
[2,"la classe","die Klasse; das Klassenzimmer"],
[2,"la salle de classe","das Klassenzimmer"],
[2,"l’emploi du temps","der Stundenplan"],
[2,"souvent","oft"],
[2,"la vie","das Leben"],
[3,"écrire","schreiben"],
[3,"donner des devoirs","Hausaufgaben aufgeben"],
[3,"les devoirs","die Hausaufgaben"],
[3,"habiter","wohnen"],
[3,"depuis","seit"],
[3,"préféré / préférée","Lieblings-; bevorzugt"],
[3,"assez","genug; ziemlich"],
[3,"beaucoup","viel; viele"],
[3,"le problème","das Problem"]
].map(([unit,fr,de],id)=>({id,unit,fr,de}));
const $=id=>document.getElementById(id), shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
let mode='choice',deck=[],pos=0,correct=0,missed=new Set(),answered=false,reverse=false;
function norm(s){return s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]/g,' ').replace(/\s+/g,' ').trim()}
function alternatives(s){return s.split(';').map(norm).filter(Boolean)}
function setText(id,s){$(id).textContent=s}
function current(){return deck[pos]}
function sides(w){return reverse?{question:w.de,answer:w.fr}:{question:w.fr,answer:w.de}}
function start(){let u=$('unit').value;let pool=vocab.filter(w=>(u==='all'||w.unit===+u)&&(!$('missed').checked||missed.has(w.id)));deck=shuffle(pool).slice(0,mode==='challenge'?Math.min(10,pool.length):pool.length);pos=0;correct=0;answered=false;setText('count',`${pool.length} Vokabeln verfügbar${$('missed').checked?' (Fehlerliste)':''}`);render()}
function render(){
 const status=$('status'), game=$('game');
 if(!deck.length){
   game.classList.add('hidden');status.classList.remove('hidden');
   status.replaceChildren();
   const p=document.createElement('p');p.textContent='Keine Vokabeln in dieser Auswahl. Deaktiviere „Nur Fehler wiederholen“ oder wähle einen anderen Volet.';
   status.append(p);return;
 }
 if(pos>=deck.length){
   game.classList.add('hidden');status.classList.remove('hidden');status.replaceChildren();
   const h=document.createElement('h2');h.textContent='Geschafft!';
   const p=document.createElement('p');p.textContent=`${correct} von ${deck.length} richtig`;
   const info=document.createElement('p');info.className='hint';info.textContent=`${missed.size} Vokabeln stehen auf deiner Fehlerliste.`;
   const btn=document.createElement('button');btn.textContent='Noch einmal üben';btn.onclick=start;
   status.append(h,p,info,btn);return;
 }
 status.classList.add('hidden');game.classList.remove('hidden');

answered=false;reverse=$('direction').value==='mix'?Math.random()<.5:$('direction').value==='de';let w=current(),s=sides(w);setText('counter',`Vokabel ${pos+1} / ${deck.length} · Volet ${w.unit}`);setText('score',`${correct} richtig`);$('bar').style.width=`${100*pos/deck.length}%`;setText('promptlabel',reverse?'Übersetze ins Französische':'Übersetze ins Deutsche');setText('prompt',s.question);setText('feedback','');$('accept').classList.add('hidden');$('next').classList.add('hidden');$('typing').classList.toggle('hidden',mode!=='type');$('choices').classList.toggle('hidden',mode!=='choice'&&mode!=='challenge');$('cardactions').classList.toggle('hidden',mode!=='cards');$('reveal').classList.remove('hidden');$('known').classList.add('hidden');$('unknown').classList.add('hidden');$('typed').value='';$('typed').disabled=false;$('submit').disabled=false;
if(mode==='choice'||mode==='challenge'){let other=shuffle(vocab.filter(x=>x.id!==w.id&&x.unit===w.unit&&sides(x).answer!==s.answer)).slice(0,3);let opts=shuffle([w,...other]);$('choices').replaceChildren();for(let o of opts){let b=document.createElement('button');b.className='option';b.textContent=sides(o).answer;b.onclick=()=>finish(o.id===w.id,b);$('choices').append(b)}}}
function finish(ok,clicked){if(answered)return;answered=true;let w=current(),s=sides(w);if(ok){correct++;missed.delete(w.id)}else missed.add(w.id);setText('score',`${correct} richtig`);let msg=ok?'Richtig!':`Richtige Antwort: ${s.answer}`;setText('feedback',msg);$('feedback').className='feedback '+(ok?'success':'error');$('next').classList.remove('hidden');if(mode==='type'){$('typed').disabled=true;$('submit').disabled=true;if(!ok && $('typed').value.trim())$('accept').classList.remove('hidden')}if(clicked){for(let b of $('choices').children){b.disabled=true;if(b.textContent===s.answer)b.classList.add('good');else if(b===clicked)b.classList.add('bad')}}}
$('accept').onclick=()=>{
 if(mode!=='type'||!answered||$('accept').classList.contains('hidden'))return;
 correct++;missed.delete(current().id);
 setText('score',`${correct} richtig`);
 setText('feedback','Als richtig gewertet. Du kannst mit „Weiter“ fortfahren.');
 $('feedback').className='feedback success';
 $('accept').classList.add('hidden');
};
$('submit').onclick=()=>{if(answered)return;let typed=norm($('typed').value),target=sides(current()).answer;finish(typed.length>0&&alternatives(target).some(a=>typed===a))};$('typed').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(answered)next();else $('submit').click()}});function next(){pos++;render()}$('next').onclick=next;$('reveal').onclick=()=>{setText('feedback',sides(current()).answer);$('reveal').classList.add('hidden');$('known').classList.remove('hidden');$('unknown').classList.remove('hidden')};$('known').onclick=()=>{correct++;missed.delete(current().id);next()};$('unknown').onclick=()=>{missed.add(current().id);next()};$('restart').onclick=start;$('unit').onchange=start;$('direction').onchange=start;$('missed').onchange=start;for(let b of $('modes').children)b.onclick=()=>{mode=b.dataset.mode;for(let x of $('modes').children)x.classList.toggle('active',x===b);start()};start();
</script></body></html>
