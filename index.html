const $=id=>document.getElementById(id), shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

 status.classList.add('hidden');game.classList.remove('hidden');$('chrono-info').classList.toggle('hidden',mode!=='challenge');

answered=false;reverse=$('direction').value==='mix'?Math.random()<.5:$('direction').value==='de';let w=current(),s=sides(w);setText('counter',`${tr('Vokabel','Mot')} ${pos+1} / ${deck.length} · ${$('unit').options[$('unit').selectedIndex].text}`);setText('score',tr(`${correct} richtig`,`${correct} correct${correct>1?'es':''}`));$('bar').style.width=`${100*pos/deck.length}%`;setText('promptlabel',reverse?tr('Übersetze ins Französische','Traduis en français'):tr('Übersetze ins Deutsche','Traduis en allemand'));setText('prompt',s.question);setText('feedback','');$('accept').classList.add('hidden');$('next').classList.add('hidden');$('typing').classList.toggle('hidden',mode!=='type');$('choices').classList.toggle('hidden',mode!=='choice'&&mode!=='challenge');$('cardactions').classList.toggle('hidden',mode!=='cards');$('reveal').classList.remove('hidden');$('known').classList.add('hidden');$('unknown').classList.add('hidden');$('typed').value='';$('typed').disabled=false;$('submit').disabled=false;
if(mode==='choice'||mode==='challenge'){let other=shuffle(vocab.filter(x=>x.id!==w.id&&(x.unit===w.unit||x.unit[0]===w.unit[0])&&sides(x).answer!==s.answer)).slice(0,3);let opts=shuffle([w,...other]);$('choices').replaceChildren();for(let o of opts){let b=document.createElement('button');b.className='option';b.textContent=sides(o).answer;b.onclick=()=>finish(o.id===w.id,b);$('choices').append(b)}}}
function finish(ok,clicked){if(answered||(mode==='challenge'&&Date.now()>=chronoDeadline)){if(mode==='challenge'&&Date.now()>=chronoDeadline)endChrono();return}answered=true;recordWord();if(mode==='challenge'){chronoAttempted++;chronoStreak=ok?chronoStreak+1:0;chronoBest=Math.max(chronoBest,chronoStreak);if(ok)chronoPoints+=10+Math.min(chronoStreak-1,5)*2;updateChrono()}let w=current(),s=sides(w);if(ok){correct++;missed.delete(w.id)}else missed.add(w.id);setText('score',tr(`${correct} richtig`,`${correct} correct${correct>1?'es':''}`));let msg=ok?tr('Richtig !','Bonne réponse !'):tr(`Richtige Antwort : ${s.answer}`,`Bonne réponse : ${s.answer}`);setText('feedback',msg);$('feedback').className='feedback '+(ok?'success':'error');$('next').classList.remove('hidden');if(mode==='type'){$('typed').disabled=true;$('submit').disabled=true;if(!ok && $('typed').value.trim())$('accept').classList.remove('hidden')}if(clicked){for(let b of $('choices').children){b.disabled=true;if(b.textContent===s.answer)b.classList.add('good');else if(b===clicked)b.classList.add('bad')}}if(mode==='challenge'){let token=chronoToken;setTimeout(()=>{if(token===chronoToken&&mode==='challenge'&&!sessionEnd&&Date.now()<chronoDeadline)next()},450)}}
$('accept').onclick=()=>{
 if(mode!=='type'||!answered||$('accept').classList.contains('hidden'))return;
 correct++;missed.delete(current().id);sessionCorrections++;
 setText('score',tr(`${correct} richtig`,`${correct} correct${correct>1?'es':''}`));
 setText('feedback',tr('Als richtig gewertet. Du kannst mit « Weiter » fortfahren.','Réponse acceptée. Tu peux passer au mot suivant.'));
 $('feedback').className='feedback success';
 $('accept').classList.add('hidden');
};
$('submit').onclick=()=>{if(answered)return;let typed=norm($('typed').value),target=sides(current()).answer;finish(typed.length>0&&alternatives(target).some(a=>typed===a))};$('typed').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();if(answered)next();else $('submit').click()}});function next(){pos++;render()}$('next').onclick=next;$('reveal').onclick=()=>{setText('feedback',sides(current()).answer);$('reveal').classList.add('hidden');$('known').classList.remove('hidden');$('unknown').classList.remove('hidden')};$('known').onclick=()=>{recordWord();correct++;missed.delete(current().id);next()};$('unknown').onclick=()=>{recordWord();missed.add(current().id);next()};$('unit').onchange=start;$('direction').onchange=start;$('missed').onchange=start;for(let b of $('modes').children)b.onclick=()=>{mode=b.dataset.mode;for(let x of $('modes').children)x.classList.toggle('active',x===b);start()};applyLanguage();
